name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release half-way; other branches only need their latest build.
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Type-check and build UI
        run: npm run build
      - name: Unit tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Every push to the default branch becomes a release the app updates to.
      RELEASE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      # Publish to another (public) repository by setting the RELEASE_REPO variable.
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        id: version
        run: node scripts/ci-version.mjs
      - name: Build installers
        run: npx tauri build --config src-tauri/tauri.ci.json
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Quota-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Write update manifest
        if: env.RELEASE == 'true' && steps.version.outputs.signing == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/latest-json.mjs
      - name: Publish release
        if: env.RELEASE == 'true' && steps.version.outputs.signing == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Quota ${{ steps.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/latest.json
      - name: Release skipped
        if: env.RELEASE == 'true' && steps.version.outputs.signing != 'true'
        run: echo "::warning::No release published - add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets to enable auto-update releases."
