[package]
name = "usagecheck"
description = "See how much usage is left on your Claude, ChatGPT and API accounts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "usagecheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
usage-core = { path = "../crates/usage-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync", "time"] }

# Windows Credential Manager on Windows; other targets only build for development.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }
# UI Automation, to see where the taskbar's own buttons are.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6" }
